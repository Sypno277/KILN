name: Kiln CI & Guardrail Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Guardrails & Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Guardrail Lint (No Hidden Defaults)
        run: npm run lint:defaults

      - name: Geometry Regression & Guardrails Suite
        run: npm run test:geometry -- --explain-geometry

      - name: Build Application
        run: npm run build

      - name: Full Parity & Accuracy Test Suite
        run: npm test

      - name: Upload Visual Diff Reports (On Failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-reports
          path: reports/visual-diff/
